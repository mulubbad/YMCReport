name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  SSH: root@${{ secrets.SSH_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build frontend
        working-directory: dashboard
        run: npm ci && npm run build
        env:
          VITE_API_URL: https://backend.ymcteam.org

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend → ymcteam.org
        run: rsync -az --delete dashboard/dist/ $SSH:/var/www/ymcteam/

      - name: Deploy backend → backend.ymcteam.org
        run: |
          rsync -az --delete --exclude node_modules --exclude '*.db*' server/ $SSH:/opt/ymcreport/server/
          rsync -az deploy/ $SSH:/opt/ymcreport/deploy/
          ssh $SSH 'cd /opt/ymcreport/server && npm ci --omit=dev && systemctl restart ymcreport && systemctl is-active ymcreport'
