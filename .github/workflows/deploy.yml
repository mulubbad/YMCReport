name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  SSH: root@${{ secrets.SSH_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build frontend
        working-directory: dashboard
        run: |
          test -n "$VITE_FIREBASE_VAPID_KEY" || { echo "VITE_FIREBASE_VAPID_KEY secret missing — push would ship silently disabled"; exit 1; }
          npm ci && npm run build
        env:
          VITE_API_URL: https://backend.ymcteam.org
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend → ymcteam.org
        run: rsync -az --delete dashboard/dist/ $SSH:/var/www/ymcteam/

      - name: Deploy backend → backend.ymcteam.org
        run: |
          rsync -az --delete --exclude node_modules --exclude '*.db*' server/ $SSH:/opt/ymcreport/server/
          rsync -az deploy/ $SSH:/opt/ymcreport/deploy/
          ssh $SSH 'cp /opt/ymcreport/deploy/nginx.conf /etc/nginx/sites-available/ymcteam && nginx -t && systemctl reload nginx \
            && cp /opt/ymcreport/deploy/ymcreport.service /etc/systemd/system/ymcreport.service && systemctl daemon-reload \
            && cd /opt/ymcreport/server && npm ci --omit=dev && systemctl restart ymcreport && systemctl is-active ymcreport'
