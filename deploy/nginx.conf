# /etc/nginx/sites-available/ymcteam
server {
    listen 80;
    server_name ymcteam.org www.ymcteam.org backend.ymcteam.org;
    return 301 https://$host$request_uri;
}

# frontend
server {
    listen 443 ssl http2;
    server_name ymcteam.org www.ymcteam.org;
    ssl_certificate     /etc/ssl/ymcteam/fullchain.pem;
    ssl_certificate_key /etc/ssl/ymcteam/privkey.pem;

    root /var/www/ymcteam;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}

# backend
server {
    listen 443 ssl http2;
    server_name backend.ymcteam.org;
    ssl_certificate     /etc/ssl/ymcteam/fullchain.pem;
    ssl_certificate_key /etc/ssl/ymcteam/privkey.pem;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
